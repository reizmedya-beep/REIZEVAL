appId: com.reizmedya.reizeval
productName: REIZEVAL
directories:
  output: dist
  buildResources: public
files:
  - "dist-electron/**/*"
  - "public/**/*"
  - "package.json"
extraResources:
  - from: ".next/standalone"
    to: ".next/standalone"
  - from: ".next/static"
    to: ".next/standalone/.next/static"
  - from: "public"
    to: ".next/standalone/public"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icons/icon.ico
  artifactName: "REIZEVAL-Setup-x64.${ext}"
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "REIZEVAL — Global Project Assessment Platform"
  uninstallDisplayName: "REIZEVAL"
  deleteAppDataOnUninstall: false
